<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Empresário Artificial</title>
  <meta name="description" content="Menos correria. Mais lucro. Mais liberdade." />
  <meta name="theme-color" content="#f7f9fc" />
  <style>
    :root {
      --bg: #f7f9fc;
      --surface: #ffffff;
      --surface-2: #f1f6ff;
      --ink: #0b1220;
      --muted: #536274;
      --line: #dbe6f3;
      --blue: #0a66ff;
      --blue-dark: #0647bd;
      --cyan: #00b7ff;
      --navy: #081b3a;
      --green: #18c37e;
      --shadow: 0 24px 70px rgba(8, 27, 58, .14);
      --radius: 28px;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 18% 8%, rgba(10,102,255,.12), transparent 28%),
        radial-gradient(circle at 88% 18%, rgba(0,183,255,.14), transparent 26%),
        linear-gradient(180deg, #ffffff 0%, #f7f9fc 50%, #eef5ff 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .55;
      background-image:
        linear-gradient(rgba(8,27,58,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(8,27,58,.045) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(#000, transparent 86%);
    }

    .wrap {
      position: relative;
      width: min(100%, 560px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 26px 18px 24px;
      display: flex;
      align-items: center;
    }

    .card {
      width: 100%;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(219,230,243,.95);
      border-radius: 36px;
      background: rgba(255,255,255,.82);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(10,102,255,.10), transparent 32%),
        radial-gradient(circle at 78% 9%, rgba(0,183,255,.18), transparent 26%);
      pointer-events: none;
    }

    .top {
      position: relative;
      padding: 20px 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid rgba(10,102,255,.16);
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      color: #25517f;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      box-shadow: 0 10px 24px rgba(8,27,58,.06);
    }

    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 0 5px rgba(24,195,126,.13);
    }

    .mini-logo {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 950;
      letter-spacing: -.05em;
      background: linear-gradient(135deg, var(--navy), var(--blue));
      box-shadow: 0 14px 28px rgba(10,102,255,.20);
    }

    .hero {
      position: relative;
      padding: 10px 22px 24px;
      text-align: center;
    }

    .avatar-shell {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 4px auto 6px;
      display: grid;
      place-items: center;
    }

    .avatar-glow {
      position: absolute;
      width: 206px;
      height: 206px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(10,102,255,.16), rgba(0,183,255,.20));
      filter: blur(2px);
      transform: translateY(12px);
    }

    .avatar-ring {
      position: absolute;
      width: 216px;
      height: 216px;
      border: 1px solid rgba(10,102,255,.14);
      border-radius: 999px;
      background: rgba(255,255,255,.66);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 18px 45px rgba(8,27,58,.10);
    }

    .avatar {
      position: relative;
      z-index: 2;
      width: 230px;
      height: 230px;
      object-fit: contain;
      object-position: center bottom;
      display: block;
      filter: drop-shadow(0 18px 26px rgba(8,27,58,.18));
    }

    h1 {
      margin: 8px 0 8px;
      font-size: clamp(34px, 7vw, 48px);
      line-height: .95;
      letter-spacing: -.055em;
      font-weight: 950;
      color: var(--ink);
    }

    .headline {
      margin: 0 auto;
      max-width: 430px;
      color: #2d3b4f;
      font-size: clamp(17px, 4vw, 22px);
      line-height: 1.2;
      font-weight: 850;
      letter-spacing: -.025em;
    }

    .headline span { color: var(--blue); }

    .sub {
      margin: 14px auto 0;
      max-width: 395px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      font-weight: 560;
    }

    .links {
      position: relative;
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      min-height: 62px;
      border: 1px solid rgba(10,102,255,.13);
      border-radius: 20px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      color: var(--ink);
      background: rgba(255,255,255,.78);
      box-shadow: 0 14px 30px rgba(8,27,58,.08);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 38px rgba(8,27,58,.13);
      border-color: rgba(10,102,255,.28);
    }

    .btn-main {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 58%, var(--navy) 100%);
      box-shadow: 0 22px 44px rgba(10,102,255,.25);
    }

    .btn-left {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
      text-align: left;
    }

    .icon {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(10,102,255,.09);
      color: var(--blue);
    }

    .btn-main .icon {
      color: #fff;
      background: rgba(255,255,255,.16);
    }

    .btn-title {
      display: block;
      font-size: 15px;
      font-weight: 950;
      letter-spacing: .02em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-note {
      display: block;
      margin-top: 2px;
      font-size: 12.5px;
      color: rgba(83,98,116,.92);
      font-weight: 650;
    }

    .btn-main .btn-note { color: rgba(255,255,255,.78); }

    .arrow {
      flex: 0 0 auto;
      font-size: 22px;
      line-height: 1;
      opacity: .72;
    }

    .proof {
      position: relative;
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .proof-card {
      border: 1px solid rgba(219,230,243,.9);
      background: rgba(255,255,255,.58);
      border-radius: 18px;
      padding: 12px;
      text-align: left;
    }

    .proof-card strong {
      display: block;
      font-size: 13px;
      color: var(--ink);
      letter-spacing: -.02em;
    }

    .proof-card small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-weight: 650;
      line-height: 1.35;
    }

    .footer {
      position: relative;
      padding: 0 22px 22px;
      text-align: center;
      color: #6b7a8d;
      font-size: 12px;
      font-weight: 650;
    }

    @media (max-width: 420px) {
      .wrap { padding: 16px 12px; }
      .card { border-radius: 30px; }
      .hero { padding-inline: 18px; }
      .avatar-shell { width: 220px; height: 220px; }
      .avatar { width: 216px; height: 216px; }
      .avatar-ring { width: 198px; height: 198px; }
      .btn { border-radius: 18px; padding: 13px 14px; }
      .btn-title { font-size: 14px; }
      .proof { grid-template-columns: 1fr; }
    }
  </style>
